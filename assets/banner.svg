<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a10" />
      <stop offset="50%" stop-color="#0f111e" />
      <stop offset="100%" stop-color="#07080c" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="badgeGradSyllable" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.25" />
    </linearGradient>

    <linearGradient id="badgeGradLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.25" />
    </linearGradient>

    <linearGradient id="badgeGradTotal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.25" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 900; font-size: 58px; fill: #ffffff; letter-spacing: -1.5px; }
    .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 22px; fill: #ffffff; }
    .badge-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
    .waveform-bar { transform-origin: bottom; animation: pulse 2s infinite alternate; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="24" fill="url(#bgGrad)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="120" r="180" fill="#a855f7" fill-opacity="0.18" filter="url(#glow)" />
  <circle cx="1000" cy="300" r="220" fill="#ec4899" fill-opacity="0.14" filter="url(#glow)" />
  <circle cx="600" cy="380" r="160" fill="#6366f1" fill-opacity="0.12" filter="url(#glow)" />

  <!-- Music Equalizer Graphical Waveforms on Left & Right -->
  <g opacity="0.3" transform="translate(60, 220)">
    <rect x="0" y="-80" width="6" height="80" rx="3" fill="#a855f7" />
    <rect x="12" y="-120" width="6" height="120" rx="3" fill="#ec4899" />
    <rect x="24" y="-60" width="6" height="60" rx="3" fill="#6366f1" />
    <rect x="36" y="-140" width="6" height="140" rx="3" fill="#a855f7" />
    <rect x="48" y="-90" width="6" height="90" rx="3" fill="#ec4899" />
    <rect x="60" y="-40" width="6" height="40" rx="3" fill="#6366f1" />
  </g>

  <g opacity="0.3" transform="translate(1070, 220)">
    <rect x="0" y="-50" width="6" height="50" rx="3" fill="#6366f1" />
    <rect x="12" y="-110" width="6" height="110" rx="3" fill="#a855f7" />
    <rect x="24" y="-150" width="6" height="150" rx="3" fill="#ec4899" />
    <rect x="36" y="-70" width="6" height="70" rx="3" fill="#6366f1" />
    <rect x="48" y="-130" width="6" height="130" rx="3" fill="#a855f7" />
    <rect x="60" y="-80" width="6" height="80" rx="3" fill="#ec4899" />
  </g>

  <!-- Central Header Content -->
  <!-- Logo Icon -->
  <g transform="translate(560, 48)">
    <rect x="0" y="0" width="80" height="80" rx="22" fill="url(#primaryGlow)" filter="url(#softGlow)" />
    <path d="M40 22v32c-1.6-.9-3.4-1.5-5.3-1.5-5.9 0-10.7 4.8-10.7 10.7s4.8 10.7 10.7 10.7 10.7-4.8 10.7-10.7V34h12V22H40z" fill="#ffffff" />
  </g>

  <!-- Title & Subtitle -->
  <text x="600" y="175" text-anchor="middle" class="title-text">
    Endo<tspan fill="url(#primaryGlow)">TTML</tspan> Database
  </text>
  <text x="600" y="215" text-anchor="middle" class="subtitle-text">
    Open-Source W3C &amp; Apple Music Syllable TTML Lyrics Database • Free Global CDN
  </text>

  <!-- Metric Badges Section -->
  <g transform="translate(160, 265)">
    <!-- Syllable Badge -->
    <g transform="translate(0, 0)">
      <rect width="260" height="96" rx="18" fill="url(#badgeGradSyllable)" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1.5" />
      <text x="24" y="44" class="badge-title">798 Tracks</text>
      <text x="24" y="70" class="badge-sub" fill="#d8b4fe">✨ Syllable-Synced (Tier 1)</text>
    </g>

    <!-- Line Badge -->
    <g transform="translate(310, 0)">
      <rect width="260" height="96" rx="18" fill="url(#badgeGradLine)" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1.5" />
      <text x="24" y="44" class="badge-title">946 Tracks</text>
      <text x="24" y="70" class="badge-sub" fill="#93c5fd">🎵 Line-Synced (Tier 2)</text>
    </g>

    <!-- Total Badge -->
    <g transform="translate(620, 0)">
      <rect width="260" height="96" rx="18" fill="url(#badgeGradTotal)" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5" />
      <text x="24" y="44" class="badge-title">1,807 Total</text>
      <text x="24" y="70" class="badge-sub" fill="#6ee7b7">🚀 99.5% Coverage</text>
    </g>
  </g>
</svg>
